name: Refresh postings

on:
  schedule:
    - cron: "12 11 * * *"   # every day, about 6:12 AM Michigan time
  workflow_dispatch:        # "Run workflow" button for refreshing by hand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed.json from the SimplifyJobs list
        run: python build_feed.py
      - name: Commit if it changed
        run: |
          git config user.name "postings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Refresh postings"
          git push
